name: Build Windows (Tesseract)

# Fork-only workflow: builds the Windows desktop app on a Windows host
# (the native modules, matrix-seshat in particular, must be compiled for
# win32 on Windows; a Linux-built package silently embeds the Linux ELF).
# The webapp is not rebuilt here: it downloads the production
# tesseract-web webapp.asar from this repo's build-inputs release.
# Environment prep mirrors upstream's build_windows.yaml (Tcl + NASM via
# choco for the SQLCipher build, MSVC rust target, VS dev shell for nmake).
on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    build-windows:
        runs-on: windows-2025
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: tesseract

            - name: Activate VS dev shell (nmake)
              uses: ilammy/msvc-dev-cmd@v1
              with:
                  arch: x64

            - name: Choco install tclsh (magicsplat)
              shell: pwsh
              run: |
                  choco install -y magicsplat-tcl-tk --no-progress
                  echo "${HOME}/AppData/Local/Apps/Tcl86/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

            - name: Choco install NetWide Assembler
              shell: pwsh
              run: |
                  choco install -y nasm --no-progress
                  echo "C:/Program Files/NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

            - name: Install Rust (MSVC target)
              shell: pwsh
              run: |
                  rustup toolchain install stable --profile minimal --no-self-update
                  rustup default stable
                  rustup target add x86_64-pc-windows-msvc

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version-file: .node-version
                  cache: "pnpm"

            - name: Fetch production webapp.asar
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh release download build-inputs-1.12.13 --pattern webapp.asar --dir .

            - name: Install dependencies
              shell: bash
              run: pnpm install --frozen-lockfile

            - name: Build native modules (hak)
              shell: pwsh
              run: pnpm build:native --target x86_64-pc-windows-msvc

            - name: Build app (ts + res)
              shell: bash
              run: pnpm run build:ts && pnpm run build:res

            - name: Package Squirrel (release version)
              shell: bash
              env:
                  VARIANT_PATH: tesseract/release/build.json
                  CSC_IDENTITY_AUTO_DISCOVERY: "false"
              run: pnpm exec electron-builder --win squirrel

            - name: Package MSI (YY.MM.VER mapping - WiX caps major at 255)
              shell: bash
              env:
                  VARIANT_PATH: tesseract/release/build.json
                  CSC_IDENTITY_AUTO_DISCOVERY: "false"
              run: |
                  node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));const [y,m,v]=p.version.split('.');p.version=y.slice(2)+'.'+m+'.'+v;fs.writeFileSync('package.json',JSON.stringify(p,null,4)+'\n');console.log('MSI build version:',p.version)"
                  pnpm exec electron-builder --win msi
                  git checkout -- package.json

            - name: Upload artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: tesseract-windows-2026.10.1
                  path: |
                      dist/*.exe
                      dist/*.msi
                      dist/*.nupkg
                      dist/RELEASES
                      dist/squirrel-windows/*.exe
                      dist/squirrel-windows/*.nupkg
                      dist/squirrel-windows/RELEASES
                  if-no-files-found: warn
